[project]
name = "as-core"
version = "0.1.0"
description = "Gemini and Qwen defense methods, Witness forms and AgentDojo runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentdojo", "semantic-action-frame-guard", "openai==1.76.2",
  "pydantic[email]==2.11.4", "httpx==0.28.1", "google-genai==1.15.0",
  "networkx==3.6.1", "langchain==0.3.24", "anthropic==0.50.0", "cohere==5.15.0",
  "transformers==5.12.1", "torch==2.5.1", "sentencepiece==0.2.0"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_all"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor", "reference"]
