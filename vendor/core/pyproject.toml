[project]
name = "semantic-action-frame-guard"
version = "0.1.0"
description = "Semantic action frame alignment guard"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.59.7",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[project.scripts]
safg = "semantic_action_frame_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_action_frame_guard"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
